<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html" />
  <meta http-equiv="Content-Style-Type" content="text/css" />
  <meta name="author" content="mino-ri" />
  <meta name="copyright" content="copyright(C) 2025 mino-ri All rights reserved." />
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" type="text/css" href="./../styles/color_standard.css" />
  <link rel="stylesheet" type="text/css" href="./../styles/style.css" />
  <script type="module" src="./../scripts/edo.js"></script>
  <script type="module" src="./../scripts/language_switcher.js"></script>
  <title>平均律近似図</title>
</head>
<body>
  <header>
    <a class="back" href="../">back</a>
    <h1 data-ls-en="EDO Approximation Diagram">平均律近似図</h1>
    <nav class="language-switcher">
      <label>
        <input type="radio" name="language" value="ja" checked />
        JP
      </label>
      <label>
        <input type="radio" name="language" value="en" />
        EN
      </label>
    </nav>
  </header>
  <section>
    <article class="editor-container">
      <div class="editor-preview" id="editor_preview" style="background:#FEFAEE; max-height:80vh; position:unset">
        <svg id="preview_figure" viewBox="0 0 1280 1920" style=" max-height:calc(80vh - 1rem); position:unset">
          <g id="group_grid"></g>
          <g id="group_3"></g>
          <g id="group_5"></g>
          <g id="group_7"></g>
          <g id="group_11"></g>
          <g id="group_13"></g>
          <g id="group_others"></g>
          <g id="group_text"></g>
        </svg>
      </div>
      <div class="editor-control">
          <div class="control-list">
            <label>
              <span data-ls-en="EDO:">平均律:</span>
              <input type="number" id="number_edo" name="number_edo" min="1" value="12" style="width: 4rem;" />
            </label>
            <label>
              <input type="checkbox" id="check_ignore_octave" name="check_ignore_octave" />
              <span data-ls-en="Ignore octave:">オクターブを無視</span>
            </label>
          </div>
        <details>
          <summary data-ls-en="Interval List">音程リスト</summary>
          <div>
            <textarea id="textarea_editor" name="textarea_editor" rows="7" placeholder="integers, fractions or monzos">243 81 27 9 3 1/3 1/9 1/27 1/81 1/243 
45 15 5 5/3 5/9 5/27 27/5 9/5 3/5 1/5 1/15 1/45 25 1/25
63 21 7/3 7 7/9 7/27 27/7 9/7 3/7 1/7 1/21 1/63
297 99 33 11 11/3 11/9 9/11 3/11 1/11 1/33 1/99 1/297
351 117 39 13 13/3 13/9 9/13 3/13 1/13 1/39 1/117 1/351
7/5 7/15 15/7 11/5 11/7 5/11 7/11 13/5 13/7 13/11 5/13 7/13 11/13</textarea>
          </div>
        </details>
        <details>
          <summary data-ls-en="Color Scheme">配色</summary>
          <div>
            <select id="select_color_palette" name="select_color_palette">
              <option value="0">P`rismatic fut`URE</option>
              <option value="1">Tone Palette</option>
              <option value="2" data-ls-en="Alt-Shasavic">代替シャサフ式</option>
              <option value="3">Commatricks</option>
            </select>
          </div>
          <div class="control-list">
            <label>
              <div data-ls-en="BG">背景</div>
              <input type="color" id="color_back" value="#FEFAEE" />
            </label>
            <label>
              <div data-ls-en="Main">メイン</div>
              <input type="color" id="color_main" value="#2B2F75" />
            </label>
            <label>
              <div data-ls-en="Sub">サブ</div>
              <input type="color" id="color_sub" value="#FDC6FE" />
            </label>
            <label>
              <div data-ls-en="Fill">塗りつぶし</div>
              <input type="color" id="color_fill" value="#FFFFFF" />
            </label>
          </div>
          <div>
            <div data-ls-en="Pitch Class">ピッチクラス</div>
            <div class="control-list">
              <input type="color" id="color0" value="#11EDE8" />
              <input type="color" id="color1" value="#25938E" />
              <input type="color" id="color2" value="#E39D11" />
              <input type="color" id="color3" value="#F24E75" />
              <input type="color" id="color4" value="#9664F0" />
              <input type="color" id="color5" value="#39A2E9" />
            </div>
          </div>
        </details>
      </div>
    </article>
  </section>
  <footer>
    copyright&copy; 2026 mino-ri All rights reserved.
  </footer>
</body>
</html>
